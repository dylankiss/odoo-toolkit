# The languages of the localization modules in `.weblate.json`, by module name.
#
# Every key is a glob pattern matched against the name of a module, and the first match wins, so list specific patterns
# before general ones. An empty list means the module follows the languages of the Weblate project. A localization
# module that matches no pattern gets the languages of the `.po` files it has.
#
# To add or change some for yourself, add them to `[weblate.l10n_languages]` in your odoo-toolkit configuration file,
# next to your authors: your patterns are checked before these.
#
#   [weblate.l10n_languages]
#   "*l10n_xx*" = ["fr"]

