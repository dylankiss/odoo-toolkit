# Extra packages for the development images, on top of what Runbot's Dockerfiles install, so modules that depend on
# them can run. `apt` packages are installed as system packages (the Python environment sees them), and `pip` packages
# are the ones Debian and Ubuntu don't have. `[common]` applies to every image, and a section named after a Runbot
# image (like `[Docker17]`) adds to it for that image only. The debugger and file watchers are in `dev.Dockerfile`.

[common]
apt = [
    "python3-fonttools",
    "python3-geoip2",
    "python3-ldap",
    "python3-maxminddb",
    "python3-pdfminer",
    "python3-slugify",
    "python3-zeep",
]
pip = [
    "cn2an",
    "jingtrang",
]

[Docker17]
apt = [
    "python3-qrcode",
    "python3-serial",
    "python3-usb",
]

[Docker18]
apt = [
    "python3-qrcode",
    "python3-serial",
    "python3-usb",
]

# The PyPI names of apt packages, for the ones that aren't just the name without `python3-`.
[pypi]
python3-jwt = "pyjwt"
python3-ldap = "python-ldap"
python3-openssl = "pyopenssl"
python3-pdfminer = "pdfminer.six"
python3-serial = "pyserial"
python3-slugify = "python-slugify"
python3-usb = "pyusb"
python3-websocket = "websocket-client"
python3-yaml = "pyyaml"

# Versions to pin instead of the ones of Ubuntu, for packages whose Ubuntu version has no wheels for Linux and macOS, so
# a virtual environment on your machine would have to build them from source.
[versions]
python3-xmlsec = "1.3.14"
