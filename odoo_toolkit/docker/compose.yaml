# The services shared by every Odoo development server started with `otk dev run`.
# Odoo itself runs in its own container per run, on this project's network.
#
# The dev containers are on an internal network (`dev`) that has no route out. PostgreSQL and Mailpit are on it, and so is
# the proxy, the only one that also reaches the internet, which only lets the allowed domains through.
name: otk

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: otk-postgres
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
      # Accept connections without a password, like a local PostgreSQL, so an Odoo running directly on your machine
      # connects without extra options. The port is only published to your machine. This only applies to new volumes.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # PostgreSQL 18 images keep their data in a version-specific folder below this one.
      - otk-postgres-data:/var/lib/postgresql
    # Only on networks without a route out: a superuser can run programs in the container (`COPY ... TO PROGRAM`), which
    # would otherwise reach the internet for whatever connects to it. The next service gives it the open network and your
    # machine.
    networks: [db, dev]
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "odoo"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The only way to PostgreSQL from the open network and from your machine, which forwards to nothing else. It's also
  # `otk-postgres` there, so Odoo, pgAdmin and your tools connect as before.
  postgres-forward:
    image: alpine/socat:1.8.1.3
    container_name: otk-postgres-forward
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${OTK_DB_PORT:-5432}:5432
    networks:
      default:
        aliases: [otk-postgres]
      db:
    healthcheck:
      test: ["CMD-SHELL", "socat -u /dev/null TCP:127.0.0.1:5432"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: otk-mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - otk-mailpit-data:/data
    ports:
      - 127.0.0.1:1025:1025  # SMTP
      - 127.0.0.1:8025:8025  # Web interface
    networks: [default, dev]

  egress:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: otk-egress
    # The domains come from your configuration, which `otk dev db` and `otk dev egress` write in this folder.
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
      - ${OTK_EGRESS_DIR:-./egress}:/etc/squid/otk:ro
    networks: [default, dev]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3128'"]
      interval: 2s
      timeout: 5s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: otk-pgadmin
    # Only started with `otk dev db --pgadmin`.
    profiles: [pgadmin]
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: pgadmin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Let the server in servers.json get its password from a command, so pgAdmin connects without asking for one.
      PGADMIN_CONFIG_ENABLE_SERVER_PASS_EXEC_CMD: "True"
    depends_on:
      - postgres
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - otk-pgadmin-data:/var/lib/pgadmin
    ports:
      - 127.0.0.1:5050:80

volumes:
  otk-postgres-data:
    name: otk-postgres-data
  otk-mailpit-data:
    name: otk-mailpit-data
  otk-pgadmin-data:
    name: otk-pgadmin-data

networks:
  default:
    name: otk
  # PostgreSQL's own network, and the one of the dev containers: neither has a route out.
  db:
    name: otk-db
    internal: true
  dev:
    name: otk-dev
    internal: true
