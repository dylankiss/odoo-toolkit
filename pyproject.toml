[project]
name = "odoo-toolkit"
version = "5.0.0"
description = "This toolkit contains a few useful tools for Odoo development."
authors = [{ name = "Dylan Kiss", email = "dyki@odoo.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "polib>=1.2.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
otk = "odoo_toolkit.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"
# Odoo's Ruff configuration, which the multiverse follows and isn't for this project.
extend-exclude = ["odoo_toolkit/multiverse_config/ruff-odoo.toml"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing-trailing-comma: the formatter decides, and Ruff advises against both
    "CPY001",   # missing-copyright-notice: the license covers the whole project
    "D100",     # undocumented-public-module
    "D104",     # undocumented-public-package
    "D203",     # incorrect-blank-line-before-class, which D211 replaces
    "D213",     # multi-line-summary-second-line, which D212 replaces
    "D301",     # escape-sequence-in-docstring: Typer needs `\n` in the help of commands
    "E501",     # line-too-long: the formatter wraps code, and long strings are fine
    "FBT001",   # boolean-type-hint-positional-argument: Typer options are positional booleans
    "FBT002",   # boolean-default-value-positional-argument: same
    "PLR0913",  # too-many-arguments: Typer commands take one argument per option
    "PLR0917",  # too-many-positional-arguments: same
    "S603",     # subprocess-without-shell-equals-true: running git, docker and npm is the point
    "S607",     # start-process-with-partial-path: same, found on the PATH
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "INP001",   # implicit-namespace-package
    "T201",     # print
]
"tests/**" = [
    "D",        # pydocstyle
    "INP001",   # implicit-namespace-package
    "PLR2004",  # magic-value-comparison
    "S101",     # assert
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["odoo_toolkit", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.17.3",
]

[tool.coverage.run]
source = ["odoo_toolkit"]

[tool.coverage.report]
# Report only: which modules lack tests, without failing the build.
skip_covered = true
show_missing = false
