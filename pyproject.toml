[project]
name = "odoo-toolkit"
version = "4.2.0"
description = "This toolkit contains a few useful tools for Odoo development."
authors = [{ name = "Dylan Kiss", email = "dyki@odoo.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "polib>=1.2.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
otk = "odoo_toolkit.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"
# Odoo's Ruff configuration, which the multiverse follows and isn't for this project.
extend-exclude = ["odoo_toolkit/multiverse_config/ruff-odoo.toml"]

[tool.ruff.lint]
preview = false
select = ["ALL"]
ignore = [
    "A004",     # builtin-import-shadowing
    "CPY001",   # missing-copyright-notice
    "D100",     # undocumented-public-module
    "D104",     # undocumented-public-package
    "D203",     # incorrect-blank-line-before-class, which D211 replaces
    "D213",     # multi-line-summary-second-line, which D212 replaces
    "D301",     # escape-sequence-in-docstring
    "E501",     # line-too-long
    "FBT001",   # boolean-type-hint-positional-argument
    "FBT002",   # boolean-default-value-positional-argument
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments, like the arguments of Typer commands
    "S602",     # subprocess-popen-with-shell-equals-true
    "S603",     # subprocess-without-shell-equals-true
    "S607",     # start-process-with-partial-path
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "INP001",   # implicit-namespace-package
    "T201",     # print
]
"tests/**" = [
    "D",        # pydocstyle
    "INP001",   # implicit-namespace-package
    "PLR2004",  # magic-value-comparison
    "S101",     # assert
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["odoo_toolkit", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.414",
    "pytest>=9.1.1",
    "ruff==0.17.3",
]
