# Opens a pull request every week when the GitHub Actions or the Python dependencies have new versions, with all
# updates of each grouped in one pull request, with Conventional Commits like `ci(deps): bump …` and `build(deps): bump …`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
