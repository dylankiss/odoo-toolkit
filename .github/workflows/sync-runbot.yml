name: Sync with Runbot

# Checks Runbot every week for new versions or changed Dockerfiles, and opens a pull request with the changes.
on:
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run scripts/sync_runbot.py
      # Pull requests opened by this workflow don't run the CI, so check the rendered images here.
      - run: uv run pytest -q tests/dev tests/test_versions.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync-runbot
          commit-message: "[IMP] versions: sync with Runbot"
          title: "[IMP] versions: sync with Runbot"
          body: |
            Runbot's versions or Dockerfiles changed. Review the diff, then run the **Docker images** workflow after
            merging to rebuild the images.
          delete-branch: true
