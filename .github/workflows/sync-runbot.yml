name: Sync with Runbot

# Checks Runbot every week for new versions or changed Dockerfiles, and opens a pull request with the changes.
on:
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run scripts/sync_runbot.py
      # The Python requirements of the images, pinned to the versions of their Ubuntu releases.
      - run: uv run scripts/sync_requirements.py
      # Pull requests opened by this workflow don't run the CI, so check the rendered images here.
      - run: uv run pytest -q tests/dev tests/test_versions.py tests/test_sync_requirements.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync-runbot
          commit-message: "chore(versions): sync with Runbot"
          title: "chore(versions): sync with Runbot"
          body: |
            Runbot's versions or Dockerfiles, or the Ubuntu versions of the Python requirements, changed. Review the diff. Merging it rebuilds the images it affects.
          delete-branch: true
