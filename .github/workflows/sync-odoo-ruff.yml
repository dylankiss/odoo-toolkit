name: Sync Odoo's Ruff rules

# Checks every week whether Odoo changed the ruff.toml of its master branch, and opens a pull request with the changes.
# `otk mv setup` copies it into the multiverse, for the repositories that don't have a version of Odoo to extend.
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: curl --fail --silent --show-error --location --output odoo_toolkit/multiverse_config/ruff-odoo.toml https://raw.githubusercontent.com/odoo/odoo/master/ruff.toml
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync-odoo-ruff
          commit-message: "[IMP] mv: sync Odoo's Ruff rules"
          title: "[IMP] mv: sync Odoo's Ruff rules"
          body: |
            The ruff.toml of Odoo's master branch changed. Review the diff.
          delete-branch: true
