name: Docker images

# Builds the development images for amd64 and arm64 on native runners, pushes them to Docker Hub and combines them
# into one multi-architecture tag per Odoo version (like `dylankiss/odoo-dev:19.0`).
#
# Needs the `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN` repository secrets.
on:
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated Runbot images to build (like `Docker19 DockerMaster`), or empty for all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: images
        env:
          REQUESTED: ${{ inputs.images }}
        run: |
          uv run python -c '
          import json, os
          from odoo_toolkit.dev.images import get_images
          requested = os.environ["REQUESTED"].split()
          print("images=" + json.dumps(requested or get_images()))
          ' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: uv run scripts/build_images.py --image "$IMAGE" --arch "$ARCH" --push

  merge:
    needs: [plan, build]
    # Also merge the images that built when others failed.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          IMAGE: ${{ matrix.image }}
        run: uv run scripts/build_images.py --image "$IMAGE" --merge
