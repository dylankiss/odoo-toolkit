name: Docker images

# Builds the development images for amd64 and arm64 on native runners, pushes them to Docker Hub and combines them
# into one multi-architecture tag per Odoo version (like `dylankiss/odoo-dev:19.0`).
#
# Needs the `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN` repository secrets.
on:
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated Runbot images to build (like `Docker19 DockerMaster`), or empty for all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - id: images
        env:
          REQUESTED: ${{ inputs.images }}
        run: |
          uv run python -c '
          import json, os
          from odoo_toolkit.dev.images import get_images
          requested = os.environ["REQUESTED"].split()
          print("images=" + json.dumps(requested or get_images()))
          ' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: uv run scripts/build_images.py --image "$IMAGE" --arch "$ARCH" --push

  merge:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          IMAGE: ${{ matrix.image }}
        run: uv run scripts/build_images.py --image "$IMAGE" --merge
