name: Docker images

# Builds the development images for amd64 and arm64 on native runners, pushes them to Docker Hub and combines them
# into one multi-architecture tag per Odoo version (like `dylankiss/odoo-dev:19.0`).
#
# Runs when what the images are built from changes on master, for only the images it affects, like after merging a
# Runbot sync. Every month, it rebuilds them all to pick up Ubuntu's security updates.
#
# Needs the `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN` repository secrets.
on:
  push:
    branches: [master]
    paths:
      - "odoo_toolkit/docker/**"
      - "odoo_toolkit/dev/images.py"
      - "odoo_toolkit/versions.json"
      - "scripts/build_images.py"
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated Runbot images to build (like `Docker19 DockerMaster`), or empty for all"
        required: false
        default: ""

permissions:
  contents: read

# Two pushes in a row would otherwise push the same tags at the same time.
concurrency:
  group: images
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit before the push, to see what changed.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: images
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ inputs.images }}
        run: |
          if [ "$EVENT" = push ]; then
            images=$(uv run scripts/build_images.py --changed-since "$BEFORE")
            echo "images=$images" >> "$GITHUB_OUTPUT"
            exit
          fi
          uv run python -c '
          import json, os
          from odoo_toolkit.dev.images import get_images
          requested = os.environ["REQUESTED"].split()
          print("images=" + json.dumps(requested or get_images()))
          ' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: uv run scripts/build_images.py --image "$IMAGE" --arch "$ARCH" --push

  merge:
    needs: [plan, build]
    # Also merge the images that built when others failed.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.images != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          IMAGE: ${{ matrix.image }}
        run: uv run scripts/build_images.py --image "$IMAGE" --merge
